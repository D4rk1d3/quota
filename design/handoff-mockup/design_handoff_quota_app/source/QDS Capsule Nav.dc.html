<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <script type="text/babel" src="./quota-icons.jsx"></script>
</helmet>
<div style="display:flex;align-items:center;gap:6px;padding:9px 14px;border-radius:999px;background:{{ navBg }};backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:0.5px solid {{ navBorder }};box-shadow:{{ navShadow }}">
  <div style="width:40px;height:40px;border-radius:999px;display:flex;align-items:center;justify-content:center;background:{{ homeBg }}">
    <x-import component-from-global-scope="QIcon" from="./quota-icons.jsx" name="home" size="21" color="{{ homeColor }}" hint-size="21px,21px"></x-import>
  </div>
  <div style="width:40px;height:40px;border-radius:999px;display:flex;align-items:center;justify-content:center;background:{{ groupsBg }}">
    <x-import component-from-global-scope="QIcon" from="./quota-icons.jsx" name="people" size="21" color="{{ groupsColor }}" hint-size="21px,21px"></x-import>
  </div>
  <div style="width:40px;height:40px;border-radius:999px;display:flex;align-items:center;justify-content:center;background:{{ calendarBg }}">
    <x-import component-from-global-scope="QIcon" from="./quota-icons.jsx" name="calendar" size="21" color="{{ calendarColor }}" hint-size="21px,21px"></x-import>
  </div>
  <div style="width:40px;height:40px;border-radius:999px;display:flex;align-items:center;justify-content:center;background:{{ activityBg }}">
    <x-import component-from-global-scope="QIcon" from="./quota-icons.jsx" name="clock" size="21" color="{{ activityColor }}" hint-size="21px,21px"></x-import>
  </div>
  <div style="width:40px;height:40px;border-radius:999px;display:flex;align-items:center;justify-content:center;background:{{ settingsBg }}">
    <x-import component-from-global-scope="QIcon" from="./quota-icons.jsx" name="gear" size="21" color="{{ settingsColor }}" hint-size="21px,21px"></x-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 260, &quot;height&quot;: 90}, &quot;active&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;home&quot;, &quot;options&quot;: [&quot;home&quot;, &quot;groups&quot;, &quot;calendar&quot;, &quot;activity&quot;, &quot;settings&quot;], &quot;tsType&quot;: &quot;string&quot;}, &quot;light&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active || 'home';
    const light = !!this.props.light;
    const items = ['home', 'groups', 'calendar', 'activity', 'settings'];
    const out = {};
    items.forEach((key) => {
      const sel = key === active;
      out[key + 'Bg'] = sel ? (light ? 'rgba(76,122,93,0.16)' : 'rgba(111,163,130,0.22)') : 'transparent';
      out[key + 'Color'] = sel ? (light ? '#3F6350' : '#6FA382') : (light ? 'rgba(0,0,0,0.45)' : 'rgba(255,255,255,0.5)');
    });
    out.navBg = light ? 'rgba(255,255,255,0.75)' : 'rgba(30,30,32,0.72)';
    out.navBorder = light ? 'rgba(0,0,0,0.07)' : 'rgba(255,255,255,0.12)';
    out.navShadow = light ? '0 10px 26px rgba(0,0,0,0.12)' : '0 10px 30px rgba(0,0,0,0.45),0 2px 8px rgba(0,0,0,0.3)';
    return out;
  }
}
</script>
</body>
</html>
