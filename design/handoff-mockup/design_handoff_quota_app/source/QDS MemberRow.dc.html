<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;align-items:center;gap:14px;padding:13px 6px;border-bottom:1px solid {{ borderColor }}">
  <dc-import name="QDS Avatar" initials="{{ initials }}" color="{{ color }}" size="md" hint-size="40px,40px"></dc-import>
  <div style="flex:1;min-width:0">
    <div style="font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;font-size:14.5px;font-weight:600;color:{{ nameColor }}">{{ name }}</div>
    <div style="font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;font-size:12.5px;color:{{ amountColor }};margin-top:2px;font-variant-numeric:tabular-nums">{{ amount }}</div>
  </div>
  <dc-import name="QDS StatusBadge" status="{{ status }}" detail="{{ detail }}" light="{{ light }}" hint-size="90px,26px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 420, &quot;height&quot;: 66}, &quot;initials&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;PT&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;color&quot;: {&quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;#5A8FBF&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;name&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Pietro&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;amount&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;€6,66&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;status&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;paid&quot;, &quot;options&quot;: [&quot;scheduled&quot;, &quot;due&quot;, &quot;paid&quot;, &quot;partial&quot;, &quot;overdue&quot;, &quot;credit&quot;, &quot;paused&quot;, &quot;removed&quot;], &quot;tsType&quot;: &quot;string&quot;}, &quot;detail&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;light&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const light = !!this.props.light;
    return {
      initials: this.props.initials || '',
      color: this.props.color || '#5A8FBF',
      name: this.props.name || '',
      amount: this.props.amount || '',
      status: this.props.status || 'paid',
      detail: this.props.detail || '',
      light,
      borderColor: light ? 'rgba(0,0,0,0.08)' : 'rgba(255,255,255,0.08)',
      nameColor: light ? 'rgba(0,0,0,0.88)' : 'rgba(255,255,255,0.94)',
      amountColor: light ? 'rgba(0,0,0,0.55)' : 'rgba(255,255,255,0.5)',
    };
  }
}
</script>
</body>
</html>
