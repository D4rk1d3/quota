<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width:100%;height:{{ height }}px;border-radius:999px;background:{{ track }};overflow:hidden">
  <div style="width:{{ percent }}%;height:100%;border-radius:999px;background:{{ color }}"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 300, &quot;height&quot;: 10}, &quot;percent&quot;: {&quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 67, &quot;min&quot;: 0, &quot;max&quot;: 100, &quot;tsType&quot;: &quot;number&quot;}, &quot;color&quot;: {&quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;height&quot;: {&quot;editor&quot;: &quot;int&quot;, &quot;default&quot;: 8, &quot;min&quot;: 4, &quot;max&quot;: 16, &quot;tsType&quot;: &quot;number&quot;}, &quot;light&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props.percent;
    const light = !!this.props.light;
    return {
      percent: (p === undefined || p === null) ? 60 : p,
      color: this.props.color || (light ? '#4C7A5D' : '#5B8F6F'),
      height: this.props.height || 8,
      track: light ? 'rgba(0,0,0,0.08)' : 'rgba(255,255,255,0.08)',
    };
  }
}
</script>
</body>
</html>
