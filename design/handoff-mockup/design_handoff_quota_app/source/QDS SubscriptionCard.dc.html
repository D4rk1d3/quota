<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="background:{{ cardBg }};border-radius:20px;padding:22px 24px;display:flex;flex-direction:column;gap:16px;box-shadow:{{ shadow }}">
  <div style="display:flex;align-items:flex-start;justify-content:space-between">
    <div>
      <div style="font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;font-size:17px;font-weight:700;color:{{ titleColor }}">{{ name }}</div>
      <div style="font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;font-size:13px;color:{{ metaColor }};margin-top:2px">{{ price }} · {{ membersLabel }}</div>
    </div>
    <dc-import name="QDS StatusBadge" status="{{ overallStatus }}" size="sm" light="{{ light }}" hint-size="80px,22px"></dc-import>
  </div>
  <dc-import name="QDS ProgressBar" percent="{{ percent }}" light="{{ light }}" hint-size="100%,8px"></dc-import>
  <div style="display:flex;align-items:baseline;justify-content:space-between">
    <span style="font-size:12.5px;color:{{ metaColor }}">{{ collected }} raccolti</span>
    <span style="font-size:12.5px;color:{{ metaColor }}">Rinnovo {{ renewDate }}</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 360, &quot;height&quot;: 160}, &quot;name&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Netflix&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;price&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;€19,99/mese&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;membersCount&quot;: {&quot;editor&quot;: &quot;int&quot;, &quot;default&quot;: 3, &quot;min&quot;: 1, &quot;max&quot;: 10, &quot;tsType&quot;: &quot;number&quot;}, &quot;percent&quot;: {&quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 70, &quot;min&quot;: 0, &quot;max&quot;: 100, &quot;tsType&quot;: &quot;number&quot;}, &quot;collected&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;€13,99&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;renewDate&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;12 set&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;overallStatus&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;due&quot;, &quot;options&quot;: [&quot;scheduled&quot;, &quot;due&quot;, &quot;paid&quot;, &quot;partial&quot;, &quot;overdue&quot;], &quot;tsType&quot;: &quot;string&quot;}, &quot;light&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const n = this.props.membersCount || 3;
    const light = !!this.props.light;
    return {
      name: this.props.name || 'Netflix',
      price: this.props.price || '€19,99/mese',
      membersLabel: n + (n === 1 ? ' membro' : ' membri'),
      percent: this.props.percent ?? 70,
      collected: this.props.collected || '€13,99',
      renewDate: this.props.renewDate || '12 set',
      overallStatus: this.props.overallStatus || 'due',
      light,
      cardBg: light ? '#fff' : '#1C1C1E',
      shadow: light ? '0 8px 22px rgba(0,0,0,0.08)' : '0 10px 28px rgba(0,0,0,0.3)',
      titleColor: light ? '#1C1C1E' : '#fff',
      metaColor: light ? 'rgba(0,0,0,0.5)' : 'rgba(255,255,255,0.5)',
    };
  }
}
</script>
</body>
</html>
