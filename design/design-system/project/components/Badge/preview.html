<!-- @dsCard group="Base" height=100 subtitle="Pillola di stato, 3 stati + annullato" -->
<div id="mount" style="padding:32px;display:flex;gap:12px;flex-wrap:wrap;align-items:center"></div>
<script>
  var mount = document.getElementById('mount');
  ["regolare", "scadenza", "ritardo", "cancelled"].forEach(function (status) {
    mount.appendChild(Quota.Badge({ status: status }));
  });
</script>
